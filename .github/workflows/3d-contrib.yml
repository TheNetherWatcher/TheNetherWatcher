name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p profile
          cp profile-3d-contrib/profile-night-rainbow.svg profile/contrib-3d-dark.svg
          cp profile-3d-contrib/profile-gitblock.svg profile/contrib-3d-light.svg
          rm -rf profile-3d-contrib
          git add -A profile
          git commit -m "Update 3D contribution graph" || exit 0
          git push
